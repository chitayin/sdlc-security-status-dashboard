databases:
  - name: sitf-security-db
    databaseName: sitf_security_db
    user: sitf_user
    plan: free
    region: singapore

services:
  - type: web
    name: sitf-security-dashboard
    runtime: python
    plan: free
    region: singapore

    buildCommand: bash build.sh

    startCommand: python -m gunicorn core.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: DATABASE_URL
        fromDatabase:
          name: sitf-security-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
